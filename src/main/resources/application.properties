spring.application.name=employee-management-system
server.port=${PORT:8080}
spring.config.import=optional:file:./local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Sign-in accounts. The defaults are demo passwords; set these environment
# variables (e.g. in Render) to use your own. Changes apply on the next start.
app.users.admin.password=${ADMIN_PASSWORD:admin123}
app.users.hr.password=${HR_PASSWORD:hr123}
app.users.viewer.password=${VIEWER_PASSWORD:viewer123}
# Show the demo accounts box on the login page (set SHOW_DEMO_LOGINS=false to hide it)
app.demo.show-logins=${SHOW_DEMO_LOGINS:true}
