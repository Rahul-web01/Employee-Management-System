<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container" style="max-width: 600px;">
    <div class="card shadow-sm text-center">
        <div class="card-body py-5">
            <h1 class="display-3 text-danger fw-bold" th:text="${status}">500</h1>
            <h4 class="mb-3" th:text="${title}">Something Went Wrong</h4>
            <p class="text-muted mb-4" th:text="${message}">Message</p>
            <a class="btn btn-primary" th:href="@{/employees}">Back to Employees</a>
        </div>
    </div>
</div>
</body>
</html>
